# The slow half of ADR-0010's quality signal, off the merge path.
#
# `cargo mutants` changes the code under the tests and asks whether anything
# fails. It is the only check that answers "do the assertions bite?" — coverage
# only answers "did the line run" — but a full run mutates the whole codebase,
# which is hours of work no pull request should wait on. So the PR job mutates
# only the diff (advisory, in ci.yml) and the whole surface is swept here,
# nightly and sharded.
#
# Exclusions come from `.cargo/mutants.toml`, which mirrors ADR-0010's
# documented coverage carve-outs, so what this reports is real gaps.
name: Nightly

on:
  schedule:
    # 07:00 UTC — overnight for the maintainer, and off the hour to stay out of
    # GitHub's cron stampede.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Sharded **eight** ways, not four.
  #
  # At four it stopped finishing: 1289 mutants over four shards is ~320 each, and
  # at the ~50 s of wall clock a mutant costs here (a build plus the whole suite,
  # two at a time) that is over five hours — GitHub's hard ceiling for a job. On
  # 2026-07-29 one shard finished in 4 h and the other three were killed at the
  # limit, so three quarters of the sweep reported nothing at all. Worse, it
  # reported nothing *quietly*: the run failed either way, because a surviving
  # mutant is also a non-zero exit, so the timeout looked like the signal working.
  #
  # Eight puts a shard at ~160 mutants, a bit over two hours, which leaves room
  # for the sweep to keep growing with the codebase before this needs revisiting.
  # The number to watch is the per-shard wall clock in the run summary; when it
  # approaches three hours, double the shards again.
  mutants:
    name: Mutants ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # Tighter than the 5 h ceiling on purpose. A shard should take ~2 h, so this
    # is generous headroom — and a shard that is going to be killed anyway should
    # be killed early rather than holding a runner for five hours to tell us so.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # The working branch, explicitly — NOT the ref that triggered this.
      #
      # A scheduled workflow always runs on the default branch, and between
      # releases `master` is frozen at the last tag: sweeping it would re-prove
      # the same released code every night and never see the version being
      # built. That is a silent failure — a green sweep of the wrong commit
      # reads exactly like a green sweep. The sweep is worth having only if it
      # follows the code that is changing, which is `next` (see CLAUDE.md's
      # branch note). If `next` is ever retired, this fails loudly rather than
      # quietly sweeping the wrong branch, which is the intended failure mode.
      - uses: actions/checkout@v7
        with:
          ref: next
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # No artifact to download from another workflow, so this job builds the
      # SPA itself — `rust-embed` needs the real one either way, or the
      # frontend-serving tests assert the fallback page and every mutant in that
      # area survives for the wrong reason.
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Mutate
        run: cargo mutants --shard ${{ matrix.shard }}/8 --test-tool nextest -j 2 -- --locked
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 14
