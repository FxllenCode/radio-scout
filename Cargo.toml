[package]
name = "radio-scout"
version = "0.1.0"
edition = "2024"

[lib]
name = "radio_scout"
path = "src/lib.rs"

[[bin]]
name = "radio-scout"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"
object_store = { version = "0.14", features = ["aws"] }
bytes = "1"
futures-util = "0.3"
http = "1"
# `db::Db` and `blob::AudioStore` are held as trait objects and have async
# methods (#97), so their futures have to be boxed. The cost is one allocation
# per database statement and per object read — real, and deliberately accepted:
# it is nanoseconds against a query or a disk read even on a Pi, and sea-orm's
# own `ConnectionTrait` is already shaped this way, so a statement was paying it
# before this. Pinned to the major sea-orm and object_store already declare
# their traits with, so cargo unifies rather than linking two copies.
async-trait = "0.1"
sha2 = "0.10"
# `formatting` for the export document's filename (#51); `parsing` for the
# recorder timestamps `query`/`ingest` read.
time = { version = "0.3", features = ["parsing", "formatting"] }
sea-orm = { version = "1", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "1", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
dotenvy = "0.15.7"
csv = "1.4.0"
# Observability (ADR-0011). `env-filter` is what makes RUST_LOG a real control
# surface (per-target directives, not just a level); the default features bring
# the fmt subscriber and the `log` bridge that carries sqlx/sea-orm's own events.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.4", features = ["derive"] }
toml = "1.1.3"
ipnet = { version = "2.12.0", features = ["serde"] }
argon2 = { version = "0.5.3", features = ["std"] }
# Constant-time comparison for the admin CSRF token (#19). Already in the tree
# via argon2's `password-hash`; named directly because a hand-rolled loop is one
# the optimiser is free to turn back into an early exit.
subtle = { version = "2.6.1", default-features = false }
# Outbound HTTP, for forwarding Calls to **Downstream** peers (#52). Default
# features are rustls in 0.13 — no OpenSSL, so the aarch64 and Windows
# cross-builds stay a plain `cargo build`.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# `id3v2` is the metadata reader #48 mines SDRTrunk's uploads with. It is a
# feature of a crate already in the tree, not a new dependency — but it is not
# implied by `mp3`, and with `default-features = false` the tag ahead of every
# SDRTrunk MPEG frame was being skipped over and discarded.
symphonia = { version = "0.6.0", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "id3v2"] }
rubato = "4.0.0"
ebur128 = "0.1.10"
biquad = "0.6.0"
nnnoiseless = { version = "0.5.2", default-features = false }
audioadapter-buffers = "4.0.0"
# The spectrum tone-out detection reads (#55). **Already in the tree** — rubato
# depends on it — so naming it directly adds no crate to the build and no
# licence to the audit; what it adds is the right to call it, which beats
# hand-rolling a DFT over a 3 kHz band on the hardware least able to afford one.
realfft = "3.5.0"
# How much room is left where the audio lives (#70). One `statvfs` on Unix and
# one `GetDiskFreeSpaceExW` on Windows, which is the whole crate — `df`'s own
# syscall rather than a system-information library, so every release target
# builds it with no C toolchain and nothing new to audit. `default-features =
# false` drops the file-locking half, which nothing here uses.
fs4 = { version = "1.1.0", default-features = false }
# **Dirwatch** (#72): being told a Recorder dropped a file, rather than walking
# its folder on a timer. inotify on Linux, FSEvents on macOS,
# ReadDirectoryChangesW on Windows — the OS's own mechanism on every release
# target, so a Pi with nothing arriving spends nothing — and `PollWatcher` for
# the network share that has no events to give. CC0.
notify = "8.2"
# Named directly for Dirwatch (#72), and **already in the tree** with these very
# features — object_store and sea-orm both pull them — so neither adds a crate.
# `chrono::Local` is the one thread-safe way to read a recorder's zone-less
# wall-clock time in this Instance's zone (the `time` crate refuses to on a
# multi-threaded Unix process), and `regex` is what an rdio filename mask has
# always been compiled into.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
# The **Station stream**'s MP3 encoder (#74). MP3 because it is the one format
# every radio-stream player plays — VLC, every browser including iOS Safari,
# Sonos, smart speakers, car head units — and its patents expired in 2017.
# Pure Rust with no runtime dependencies, chosen over LAME so the tree gains no
# autotools build on every release target. Young (2026), so it is held to one
# module, `station::encode`, whose tests judge its output with *our* decoder
# rather than its own.
rusty_mp3 = "1"
# **Built-in TLS** (#76): HTTPS from the binary itself, for an Operator with no
# tunnel or proxy in front. Every crate below rides the rustls + aws-lc-rs stack
# reqwest and object_store already build on every release target, so the binary
# gains no C toolchain and no OpenSSL. `rustls` and `tokio-rustls` are already in
# the tree; named directly to build a server rather than only a client.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
# PEM in, DER out — an Operator's own certificate files, and the issued chain
# this Instance writes beside its database. Already in the tree.
rustls-pki-types = { version = "1", features = ["std"] }
# The ACME client (RFC 8555): orders, challenges, and ARI (RFC 9773) for when to
# renew. Chosen over `rustls-acme` because it is a client and nothing more — the
# renewal schedule, the challenge store and the listener stay ours, so renewal
# runs on the Instance's own `Clock` as a Worker the suite can settle, where
# `rustls-acme` keeps its own timer the suite could only sleep on. Its HTTP is
# hyper-rustls, already in the tree.
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen", "time", "x509-parser"] }
# The TLS-ALPN-01 challenge certificate (RFC 8737), which carries the
# `acmeIdentifier` extension a CA looks for. Already in instant-acme's tree.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# When a certificate expires — the one fact about it the renewal schedule and
# the status page need. Already in instant-acme's tree, at this version.
x509-parser = "0.18"

# What ships (#23, ADR-0007). Nothing had ever been built in release mode
# before this ticket, so every value here is a deliberate choice rather than an
# inherited one:
#
# - `opt-level = 3` because the release binary is where the audio work happens —
#   resampling, loudness, noise suppression (#20) — on a Pi 5 that is also
#   running the recorder. Size matters, but not more than keeping up.
# - `lto = "fat"` + one codegen unit: the single largest win for both size and
#   speed, and a release build is cut rarely enough that the compile time is
#   nobody's inner loop.
# - `strip = "debuginfo"`, *not* `"symbols"`. Dropping DWARF is most of the size;
#   keeping the symbol table is what makes a panic on someone else's Pi arrive
#   as function names instead of hex addresses, and a scanner nobody can debug
#   remotely is worth more megabytes than it saves.
# - `panic = "unwind"` is the default, and is spelled out because `"abort"` is
#   the tempting size win and would be a correctness bug: one panicking request
#   handler would take the whole server — every listener, every recorder — down
#   with it instead of failing that one task.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# Nothing is un-instrumented (ADR-0011): application output goes through
# `tracing`, so the print macros are a compile error rather than a habit. Cargo
# applies these to every target in the package, so the places whose stdout
# genuinely *is* their product — the hand-run examples, and the tests that report
# themselves skipped — carry a narrow `#![allow]` saying why.
# (`build.rs` needs no exemption: cargo doesn't run clippy over build scripts.)
[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dev-dependencies]
# `test-util` is what `#[tokio::test(start_paused = true)]` needs: it pauses the
# clock and advances it only when the runtime has nothing else to do, so the
# live-feed loop's thirty-second heartbeat is proven in microseconds and with no
# sleep to be flaky about (#94). A dev-dependency, so a release build never
# carries the mock clock.
tokio = { version = "1", features = ["full", "test-util"] }
# The same major the library forwards Calls with (and the same one
# `object_store` already pulls in): two versions of reqwest in one package makes
# the name ambiguous in test targets.
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "cookies"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tempfile = "3"
# The substitutes the harness composes (#97) implement `blob::AudioStore` and
# `db::Connection`, so the test crates name those traits' (`async_trait`-shaped)
# signatures directly — and `tests/blob.rs` and `tests/s3.rs` still drive the
# real `object_store` types. Both are already in the dependency graph via the
# library, pinned to the same majors so cargo unifies rather than linking two.
object_store = { version = "0.14", features = ["aws"] }
async-trait = "0.1"
# Test-hardening tooling (ADR-0010): property-based edge-case generation,
# parametrized case tables, and wire-format snapshots. cargo-nextest /
# cargo-llvm-cov / cargo-mutants are external binaries, not deps.
proptest = "1"
rstest = "0.26"
# Only for `callsite::rebuild_interest_cache` in the log-capture test harness —
# see the note in `src/testing.rs`.
tracing-core = "0.1"
insta = { version = "1", features = ["json"] }
# `ServiceExt::oneshot`, for the one middleware a socket cannot reach (#76): the
# LAN door redirects a *public* peer, and every peer the suite can be is
# loopback. Already in the tree under axum, at this major.
tower = { version = "0.5", features = ["util"] }
