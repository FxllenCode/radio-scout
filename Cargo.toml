[package]
name = "radio-scout"
version = "0.1.0"
edition = "2024"

[lib]
name = "radio_scout"
path = "src/lib.rs"

[[bin]]
name = "radio-scout"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"
object_store = { version = "0.14", features = ["aws"] }
bytes = "1"
futures-util = "0.3"
http = "1"
# `db::Db` and `blob::AudioStore` are held as trait objects and have async
# methods (#97), so their futures have to be boxed. The cost is one allocation
# per database statement and per object read — real, and deliberately accepted:
# it is nanoseconds against a query or a disk read even on a Pi, and sea-orm's
# own `ConnectionTrait` is already shaped this way, so a statement was paying it
# before this. Pinned to the major sea-orm and object_store already declare
# their traits with, so cargo unifies rather than linking two copies.
async-trait = "0.1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
sea-orm = { version = "1", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "1", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
dotenvy = "0.15.7"
csv = "1.4.0"
# Observability (ADR-0011). `env-filter` is what makes RUST_LOG a real control
# surface (per-target directives, not just a level); the default features bring
# the fmt subscriber and the `log` bridge that carries sqlx/sea-orm's own events.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.4", features = ["derive"] }
toml = "1.1.3"
ipnet = { version = "2.12.0", features = ["serde"] }
argon2 = { version = "0.5.3", features = ["std"] }
# Constant-time comparison for the admin CSRF token (#19). Already in the tree
# via argon2's `password-hash`; named directly because a hand-rolled loop is one
# the optimiser is free to turn back into an early exit.
subtle = { version = "2.6.1", default-features = false }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
# Outbound HTTP, for delivering Web Push (#16). Default features are rustls in
# 0.13 — no OpenSSL, so the aarch64 and Windows cross-builds stay a plain
# `cargo build`.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
symphonia = { version = "0.6.0", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4"] }
rubato = "4.0.0"
ebur128 = "0.1.10"
biquad = "0.6.0"
nnnoiseless = { version = "0.5.2", default-features = false }
audioadapter-buffers = "4.0.0"

# What ships (#23, ADR-0007). Nothing had ever been built in release mode
# before this ticket, so every value here is a deliberate choice rather than an
# inherited one:
#
# - `opt-level = 3` because the release binary is where the audio work happens —
#   resampling, loudness, noise suppression (#20) — on a Pi 5 that is also
#   running the recorder. Size matters, but not more than keeping up.
# - `lto = "fat"` + one codegen unit: the single largest win for both size and
#   speed, and a release build is cut rarely enough that the compile time is
#   nobody's inner loop.
# - `strip = "debuginfo"`, *not* `"symbols"`. Dropping DWARF is most of the size;
#   keeping the symbol table is what makes a panic on someone else's Pi arrive
#   as function names instead of hex addresses, and a scanner nobody can debug
#   remotely is worth more megabytes than it saves.
# - `panic = "unwind"` is the default, and is spelled out because `"abort"` is
#   the tempting size win and would be a correctness bug: one panicking request
#   handler would take the whole server — every listener, every recorder — down
#   with it instead of failing that one task.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# Nothing is un-instrumented (ADR-0011): application output goes through
# `tracing`, so the print macros are a compile error rather than a habit. Cargo
# applies these to every target in the package, so the places whose stdout
# genuinely *is* their product — the hand-run examples, and the tests that report
# themselves skipped — carry a narrow `#![allow]` saying why.
# (`build.rs` needs no exemption: cargo doesn't run clippy over build scripts.)
[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dev-dependencies]
# The same major the library sends push notifications with (and the same one
# `object_store` already pulls in): two versions of reqwest in one package makes
# the name ambiguous in test targets.
reqwest = { version = "0.13", default-features = false, features = ["multipart", "json", "cookies"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tempfile = "3"
# The substitutes the harness composes (#97) implement `blob::AudioStore` and
# `db::Connection`, so the test crates name those traits' (`async_trait`-shaped)
# signatures directly — and `tests/blob.rs` and `tests/s3.rs` still drive the
# real `object_store` types. Both are already in the dependency graph via the
# library, pinned to the same majors so cargo unifies rather than linking two.
object_store = { version = "0.14", features = ["aws"] }
async-trait = "0.1"
# Test-hardening tooling (ADR-0010): property-based edge-case generation,
# parametrized case tables, and wire-format snapshots. cargo-nextest /
# cargo-llvm-cov / cargo-mutants are external binaries, not deps.
proptest = "1"
rstest = "0.26"
# Only for `callsite::rebuild_interest_cache` in the log-capture test harness —
# see the note in `src/testing.rs`.
tracing-core = "0.1"
insta = { version = "1", features = ["json"] }
